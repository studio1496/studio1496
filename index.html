    <body class="no-scroll">

        <main class="container">
            <div id="random-images"></div>
        </main>
        <footer class="footer">
            © 2026 studio1496
        </footer>

        <script>
        const hamburger = document.getElementById('hamburger');
        const nav = document.getElementById('main-nav');
        const closeBtn = document.getElementById('close-btn');
        hamburger.addEventListener('click', () => {
            nav.classList.toggle('active');
        });
        closeBtn.addEventListener('click', () => {
            nav.classList.remove('active');
        });

        /*--------ランダム写真配置--------------*/
        const imageList = [
            "images/index/img1.jpg",
            "images/index/img2.jpg",
            "images/index/img3.jpg",
            "images/index/img4.jpg",
            "images/index/img5.jpg",
            "images/index/img6.jpg",
            "images/index/img7.jpg",
            "images/index/img8.jpg",
            "images/index/img9.jpg",
            "images/index/img10.jpg",
            "images/index/img11.jpg",
            "images/index/img12.jpg",
            "images/index/img13.jpg",
            "images/index/img14.jpg",
        ];

        // 配列をシャッフル
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const selected = shuffle([...imageList]).slice(0, 6); // ランダム6枚
        const container = document.getElementById("random-images");

        selected.forEach((src, index) => {
            setTimeout(() => {
                const img = document.createElement("img");
                img.src = src;
                img.classList.add("random-img");

                // ★ ランダムサイズ（360〜720px）
                const size = 360 + Math.random() * 360;
                img.style.width = size + "px";

                 // ★ 画面サイズを取得
                const vw = window.innerWidth;
                const vh = window.innerHeight;

                // ★ 画像が画面外に出ないように位置を計算
                const maxLeft = vw - size - 20; // 20pxは余白
                const maxTop = vh - size - 20;

                const left = Math.random() * maxLeft;
                const top = Math.random() * maxTop;

                img.style.left = left + "px";
                img.style.top = top + "px";

                container.appendChild(img);
            }, index * 300); // ← 0.3秒ごとに“パッ”と出る
        });
        /*------------------------------------------------------*/

        </script>
    </body>
</html>
